[package]
name = "minecli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A CLI for managing Minecraft server mods, datapacks, and plugins."
license = "MIT"
readme = "README.md"

[dependencies]
clap = { version = "4.5.50", features = ["derive"] }
clap_complete = "4.5.61"
directories = "6.0.0"
hex = "0.4.3"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha1 = "0.10.6"
sha2 = "0.10.9"
thiserror = "2.0.17"
toml = "0.9.8"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.23.0"
